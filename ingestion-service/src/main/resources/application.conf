# Knurl ingestion-service configuration.
# ${?VAR} = optional override of an env var. Local dev values instead come from
# application-local.conf / application-instagram.conf (see README.md), which are merged with
# higher priority than this file. In deployed environments, set these as real env vars.
# A field with neither a real env var nor a local override is left unset, and the service fails
# fast at startup because the corresponding Kotlin config field is non-nullable.
# See README.md for the full environment variable reference.

database {
  url = ${?DATABASE_URL}
  maximumPoolSize = ${?DB_MAX_POOL_SIZE}
  minimumIdle = ${?DB_MIN_IDLE}
  idleTimeoutMs = ${?DB_IDLE_TIMEOUT_MS}
}

s3 {
  bucketName = ${?S3_BUCKET_NAME}
  region = ${?S3_REGION}
  endpoint = ${?S3_ENDPOINT}
  accessKeyId = ${?S3_ACCESS_KEY_ID}
  secretAccessKey = ${?S3_SECRET_ACCESS_KEY}
  pathStyleAccess = ${?S3_PATH_STYLE_ACCESS}
}

instagram {
  accessToken = ${?INSTAGRAM_ACCESS_TOKEN}
  businessAccountId = ${?INSTAGRAM_BUSINESS_ACCOUNT_ID}
  adminToken = ${?ADMIN_TOKEN}
  apiVersion = ${?INSTAGRAM_API_VERSION}
  credentialProvider = ${?INSTAGRAM_CREDENTIAL_PROVIDER}
  credentialBroker {
    url = ${?INSTAGRAM_CREDENTIAL_BROKER_URL}
    bearerToken = ${?INSTAGRAM_CREDENTIAL_BROKER_TOKEN}
    bearerTokenFile = ${?INSTAGRAM_CREDENTIAL_BROKER_TOKEN_FILE}
    allowPlaintextHttp = ${?INSTAGRAM_CREDENTIAL_BROKER_ALLOW_PLAINTEXT_HTTP}
  }
}

runOnce = ${?RUN_ONCE}
intervalSeconds = ${?INGESTION_INTERVAL_SECONDS}
