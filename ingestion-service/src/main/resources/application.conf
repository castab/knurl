# Knurl ingestion-service configuration.
# ${?VAR} = optional override of an env var. An unset ${?VAR} drops the key from this file entirely,
# so local dev falls through to config/application-local.conf and config/application-instagram.conf
# (see README.md). In deployed environments, set these as real env vars.
# This is the ONLY config file packaged into the jar/image - the dev defaults are read from disk and
# never ship. A field with neither a real env var nor a local override is left unset, and the service
# fails fast at startup because the corresponding Kotlin config field is non-nullable.
# See README.md for the full environment variable reference.

database {
  url = ${?DATABASE_URL}
  maximumPoolSize = ${?DB_MAX_POOL_SIZE}
  minimumIdle = ${?DB_MIN_IDLE}
  idleTimeoutMs = ${?DB_IDLE_TIMEOUT_MS}
}

s3 {
  bucketName = ${?S3_BUCKET_NAME}
  region = ${?S3_REGION}
  endpoint = ${?S3_ENDPOINT}
  accessKeyId = ${?S3_ACCESS_KEY_ID}
  secretAccessKey = ${?S3_SECRET_ACCESS_KEY}
  pathStyleAccess = ${?S3_PATH_STYLE_ACCESS}
}

instagram {
  accessToken = ${?INSTAGRAM_ACCESS_TOKEN}
  businessAccountId = ${?INSTAGRAM_BUSINESS_ACCOUNT_ID}
  apiVersion = ${?INSTAGRAM_API_VERSION}
}

credentials {
  mode = ${?CREDENTIALS_MODE}
  http {
    url = ${?CREDENTIALS_HTTP_URL}
    authorizationToken = ${?CREDENTIALS_AUTHORIZATION_TOKEN}
    authorizationTokenFile = ${?CREDENTIALS_AUTHORIZATION_TOKEN_FILE}
    allowPlaintext = ${?CREDENTIALS_HTTP_ALLOW_PLAINTEXT}
  }
}

# Required under CREDENTIALS_MODE=LOCAL only; HTTP mode never writes auth_config, so it needs no
# cipher and rejects nothing when this is absent. Enforced in IngestionConfig's init block.
credentialEncryptionKey = ${?CREDENTIAL_ENCRYPTION_KEY}

runOnce = ${?RUN_ONCE}
intervalSeconds = ${?INGESTION_INTERVAL_SECONDS}
feedSyncConcurrency = ${?FEED_SYNC_CONCURRENCY}
downloadWorkerConcurrency = ${?DOWNLOAD_WORKER_CONCURRENCY}
downloadClaimBatchSize = ${?DOWNLOAD_CLAIM_BATCH_SIZE}
downloadClaimLeaseSeconds = ${?DOWNLOAD_CLAIM_LEASE_SECONDS}
accountSyncLeaseSeconds = ${?ACCOUNT_SYNC_LEASE_SECONDS}
completedDownloadRetentionHours = ${?COMPLETED_DOWNLOAD_RETENTION_HOURS}
claimPollIntervalMs = ${?CLAIM_POLL_INTERVAL_MS}
