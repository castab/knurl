# Knurl ingestion-service local development configuration.
#
# This file IS tracked in git and shared with the team - it's merged with higher priority than
# application.conf, so these values apply whenever no real DATABASE_URL/S3_* env var is set (i.e.
# whenever you're not deployed). Do NOT put real secrets here; it matches docker-compose.yml's
# dev-only Postgres/MinIO credentials, which are not meant to be secret.
#
# Instagram credentials go in application-instagram.conf instead (gitignored).

database {
  url = "postgres://knurl:knurl@localhost:5432/knurl"
  maximumPoolSize = 2
  minimumIdle = 1
  idleTimeoutMs = 30000
}

s3 {
  bucketName = "knurl-media"
  region = "us-east-1"
  endpoint = "http://localhost:9000"
  accessKeyId = "knurl"
  secretAccessKey = "knurl-dev-secret"
  pathStyleAccess = true
}

# Dev-only AES-256 key (32 raw bytes, base64) for CredentialCipher - encrypts the Instagram access
# token at rest in `auth_config`. Fixed and checked in like the Postgres/MinIO credentials above,
# not meant to be secret. Generate a real one for any non-local deployment with
# CredentialCipher.generateKey() and set it via the CREDENTIAL_ENCRYPTION_KEY env var.
credentialEncryptionKey = "qLR8ZqfBjeSX+//L5XPt1yED97ObxTATN/CFEMwu3S8="
