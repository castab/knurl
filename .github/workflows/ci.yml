name: CI

# Runs the same checks locally available via `./gradlew build` (compile, ktlint via Kotlinter,
# and the full Kotest suite for all three modules) on every push and pull request. Nothing
# currently enforces this repo's passing build outside a developer's own machine - this workflow
# is that enforcement.
#
# `push` is scoped to `main` only, not every branch, specifically so it never overlaps with
# `pull_request`: pushing to an open PR's branch fires `pull_request` (`synchronize`) but not
# `push` (the branch isn't `main`), and merging into `main` fires `push` but not another
# `pull_request` event. Widening `push` to all branches would make every commit on an open PR
# run this workflow twice for the same code - once as `push`, once as `pull_request`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancels a still-running CI run for the same PR (or the same branch, for a direct push to main)
# when a newer commit supersedes it, so rapid follow-up pushes don't pile up redundant runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, lint, and test
        # `sh gradlew`, not `./gradlew`: the wrapper is committed without the executable bit (this
        # repo is edited on Windows - see both Dockerfiles' identical note and workaround).
        run: sh gradlew build --no-daemon
