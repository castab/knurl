name: knurl

# Dependencies for ./gradlew :knurl-app:run; register accounts through the management API.

services:
  postgres:
    image: postgres:18
    container_name: knurl-postgres
    environment:
      POSTGRES_USER: knurl
      POSTGRES_PASSWORD: knurl
      POSTGRES_DB: knurl
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18's official image expects the volume at the parent directory (it manages a
      # major-version-specific subdirectory itself) - mounting at .../data directly fails startup.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knurl -d knurl"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.5.0
    container_name: knurl-garage
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK00000000000000000000000000000000
      GARAGE_DEFAULT_SECRET_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      GARAGE_DEFAULT_BUCKET: knurl-media
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./dev/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  garage-data:
