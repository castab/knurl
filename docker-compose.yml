name: knurl

# Local development dependencies for both services: Postgres 18 (native uuidv7()) and MinIO as
# an S3-compatible bucket. Does NOT run ingestion-service/presentation-service themselves - run
# those with ./gradlew :ingestion-service:run / :presentation-service:run against these, using the
# env values documented in README.md's "Local development with Docker Compose" section.

services:
  postgres:
    image: postgres:18
    container_name: knurl-postgres
    environment:
      POSTGRES_USER: knurl
      POSTGRES_PASSWORD: knurl
      POSTGRES_DB: knurl
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18's official image expects the volume at the parent directory (it manages a
      # major-version-specific subdirectory itself) - mounting at .../data directly fails startup.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knurl -d knurl"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: knurl-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: knurl
      MINIO_ROOT_PASSWORD: knurl-dev-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the dev bucket, then exits. Re-run safe (--ignore-existing).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: knurl-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 knurl knurl-dev-secret &&
      mc mb --ignore-existing local/knurl-media
      "
    restart: "no"

volumes:
  postgres-data:
  minio-data:
