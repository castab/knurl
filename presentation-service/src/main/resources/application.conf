# Knurl presentation-service configuration.
# ${?VAR} = optional override of an env var. Local dev values instead come from
# application-local.conf (see README.md), which is merged with higher priority than this file.
# In deployed environments, set these as real env vars.
# A field with neither a real env var nor a local override is left unset, and the service fails
# fast at startup because the corresponding Kotlin config field is non-nullable.
# See README.md for the full environment variable reference.

database {
  url = ${?DATABASE_URL}
  maximumPoolSize = ${?DB_MAX_POOL_SIZE}
  minimumIdle = ${?DB_MIN_IDLE}
  idleTimeoutMs = ${?DB_IDLE_TIMEOUT_MS}
}

s3 {
  bucketName = ${?S3_BUCKET_NAME}
  region = ${?S3_REGION}
  endpoint = ${?S3_ENDPOINT}
  accessKeyId = ${?S3_ACCESS_KEY_ID}
  secretAccessKey = ${?S3_SECRET_ACCESS_KEY}
  pathStyleAccess = ${?S3_PATH_STYLE_ACCESS}
}

credentials {
  mode = ${?CREDENTIALS_MODE}
  http {
    url = ${?CREDENTIALS_HTTP_URL}
    authorizationToken = ${?CREDENTIALS_AUTHORIZATION_TOKEN}
    authorizationTokenFile = ${?CREDENTIALS_AUTHORIZATION_TOKEN_FILE}
    allowPlaintext = ${?CREDENTIALS_HTTP_ALLOW_PLAINTEXT}
  }
}

# CREDENTIALS_MODE=LOCAL only - the single account this deployment serves and the two tokens it
# accepts for it. Unset these in HTTP mode, where the control plane supplies every account's pair.
local {
  instagramBusinessAccountId = ${?INSTAGRAM_BUSINESS_ACCOUNT_ID}
  adminToken = ${?ADMIN_TOKEN}
  readToken = ${?READ_TOKEN}
}

port = ${?PORT}
presignedGetTtlSeconds = ${?S3_PRESIGNED_GET_TTL_SECONDS}
uiEnabled = ${?UI_ENABLED}
rateLimitPerMinute = ${?RATE_LIMIT_PER_MINUTE}
