# Knurl presentation-service local development configuration.
#
# This file IS tracked in git and shared with the team. It is the lowest-priority config layer, so
# these values apply only where application.conf supplied nothing - i.e. whenever no real
# DATABASE_URL/S3_* env var is set, i.e. whenever you're not deployed. Do NOT put real secrets here;
# it matches docker-compose.yml's dev-only Postgres/MinIO credentials, which are not meant to be secret.
#
# It lives OUTSIDE src/main/resources on purpose and is loaded with PropertySource.file(...) relative
# to the presentation-service/ working directory, so it is never packaged into the jar or image.
# Moving it back under a resource root would make this service accept the dev token pair below in a
# real deployment.

database {
  url = "postgres://knurl:knurl@localhost:5432/knurl"
  maximumPoolSize = 2
  minimumIdle = 1
  idleTimeoutMs = 30000
}

s3 {
  bucketName = "knurl-media"
  region = "us-east-1"
  endpoint = "http://localhost:9000"
  accessKeyId = "knurl"
  secretAccessKey = "knurl-dev-secret"
  pathStyleAccess = true
}

# uiEnabled now defaults to false in code (see PresentationConfig) so a deployment doesn't
# silently serve the admin UI without opting in - overridden back to true here so local
# development keeps the UI available without setting UI_ENABLED yourself.
uiEnabled = true

# Dev-only placeholders, not meant to be secret (see header comment). These are the tokens local
# CREDENTIALS_MODE=LOCAL development accepts; a real deployment sets ADMIN_TOKEN/READ_TOKEN itself,
# or runs in HTTP mode where a control plane owns them. The account id matches the one
# ingestion-service's own application-instagram.conf anchors.
local {
  instagramBusinessAccountId = "dev-account"
  adminToken = "dev-admin-token-not-secret"
  readToken = "dev-read-token-not-secret"
}
